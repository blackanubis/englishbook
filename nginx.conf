# ============ Nginx 配置 · 英语学习网页 ============
# 监听端口 13001，仅支持 IPv4（避免与 docker-entrypoint IPv6 脚本冲突）

server {
    listen 13001;
    server_name _;

    # 字符集
    charset utf-8;

    # 根目录
    root /usr/share/nginx/html;
    index index.html;

    # ============ MIME 类型（必须含 text/html，否则浏览器弹下载框） ============
    types {
        text/html                             html htm;
        text/css                              css;
        text/plain                            txt;
        text/xml                              xml;
        application/json                      json;
        application/javascript                js;
        application/xml+rss                   rss;
        application/atom+xml                  atom;
        image/svg+xml                         svg;
    }
    # 注意：不要设置 default_type application/octet-stream
    # 这会让浏览器把所有未匹配文件当下载流处理

    # ============ 性能优化 ============
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/html
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ============ 安全：禁止隐藏文件 ============
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ============ 路由：根路径 / ============
    # 注意：必须用 = / /index.html 而不是 try_files，避免某些浏览器把内部重定向当下载
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Content-Type "text/html; charset=utf-8" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============ 静态资源缓存 ============
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        expires 7d;
    }

    location ~* \.json$ {
        add_header Cache-Control "public, max-age=86400";
        expires 1d;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        expires 30d;
    }

    # ============ 错误页 ============
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}